---
name: Pages CI Build and Deploy

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Private source repository"
        required: true
        type: string
      source_ref_name:
        description: "Source branch name"
        required: true
        type: string
      source_sha:
        description: "Immutable source commit SHA"
        required: true
        type: string
      source_event:
        description: "Original source event"
        required: true
        type: string
      source_run_id:
        description: "Successful private source workflow run ID"
        required: false
        type: string
      source_run_attempt:
        description: "Successful private source workflow run attempt"
        required: false
        type: string

# Deny GitHub's token all capabilities by default. Each job receives only the
# permissions it needs; cross-repository reads use the scoped repository secret.
permissions: {}

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Verify source and package Pages output
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PRIVATE_REPO_DIR: __private_blog_data
      PRIVATE_WEB_DIR: __private_blog_data/web
      PAGES_ARTIFACT_DIR: __pages_artifact

    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF_NAME: ${{ inputs.source_ref_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_EVENT: ${{ inputs.source_event }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail

          [[ "${SOURCE_REPO}" == "buenhyden/blog-data" ]]
          [[ "${SOURCE_REF_NAME}" == "main" ]]
          [[ "${SOURCE_EVENT}" == "push" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]

          if [[ -n "${SOURCE_RUN_ID}" ]]; then
            [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          fi

          if [[ -n "${SOURCE_RUN_ATTEMPT}" ]]; then
            [[ "${SOURCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          fi

      - name: Verify successful private source CI run
        id: source_attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BLOG_DEPLOY_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_ATTESTATION_FILE: ${{ runner.temp }}/source-run.json
        run: |
          set -euo pipefail

          API_ROOT="https://api.github.com/repos/buenhyden/blog-data"
          RUN_RESPONSE="${RUNNER_TEMP}/source-run-response.json"
          ATTESTED=false

          for attestation_attempt in {1..24}; do
            if [[ -n "${SOURCE_RUN_ID}" ]]; then
              RUN_URL="${API_ROOT}/actions/runs/${SOURCE_RUN_ID}"
              curl --fail-with-body --retry 3 --retry-delay 3 \
                --retry-connrefused --silent --show-error --location \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${RUN_URL}" \
                --output "${SOURCE_ATTESTATION_FILE}"
            else
              RUN_URL="${API_ROOT}/actions/workflows/trigger-pages-build.yml/runs"
              curl --fail-with-body --retry 3 --retry-delay 3 \
                --retry-connrefused --silent --show-error --get \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --data-urlencode "branch=main" \
                --data-urlencode "event=push" \
                --data-urlencode "status=success" \
                --data-urlencode "head_sha=${SOURCE_SHA}" \
                --data-urlencode "per_page=10" \
                "${RUN_URL}" \
                --output "${RUN_RESPONSE}"

              jq --arg source_sha "${SOURCE_SHA}" \
                '.workflow_runs
                  | map(select(.head_sha == $source_sha))
                  | first // empty' \
                "${RUN_RESPONSE}" > "${SOURCE_ATTESTATION_FILE}"
            fi

            if jq --exit-status \
              --arg source_sha "${SOURCE_SHA}" \
              --arg source_run_id "${SOURCE_RUN_ID}" \
              --arg source_run_attempt "${SOURCE_RUN_ATTEMPT}" \
              '
                .repository.full_name == "buenhyden/blog-data" and
                .head_repository.full_name == "buenhyden/blog-data" and
                .status == "completed" and
                .conclusion == "success" and
                .event == "push" and
                .head_branch == "main" and
                .path == ".github/workflows/trigger-pages-build.yml" and
                .head_sha == $source_sha and
                ($source_run_id == "" or
                  (.id | tostring) == $source_run_id) and
                ($source_run_attempt == "" or
                  (.run_attempt | tostring) == $source_run_attempt)
              ' "${SOURCE_ATTESTATION_FILE}" > /dev/null; then
              ATTESTED=true
              break
            fi

            echo "Waiting for private source run attestation (${attestation_attempt}/24)."
            sleep 5
          done

          if [[ "${ATTESTED}" != "true" ]]; then
            echo "::error::Private source CI run did not reach a verified success state."
            exit 1
          fi

          ATTESTED_RUN_ID="$(jq --raw-output '.id' "${SOURCE_ATTESTATION_FILE}")"
          ATTESTED_RUN_ATTEMPT="$(
            jq --raw-output '.run_attempt' "${SOURCE_ATTESTATION_FILE}"
          )"
          echo "run_id=${ATTESTED_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "run_attempt=${ATTESTED_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "Verified private source CI run ${ATTESTED_RUN_ID}."

      - name: Checkout exact private source commit
        # actions/checkout@v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: buenhyden/blog-data
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.BLOG_DEPLOY_TOKEN }}
          path: ${{ env.PRIVATE_REPO_DIR }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Setup Node
        # actions/setup-node@v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install private source dependencies quietly
        working-directory: ${{ env.PRIVATE_WEB_DIR }}
        shell: bash
        env:
          HUSKY: "0"
          ATTESTED_RUN_ID: ${{ steps.source_attestation.outputs.run_id }}
          PRIVATE_INSTALL_LOG: ${{ runner.temp }}/private-install.log
        run: |
          set -euo pipefail

          if ! npm ci --no-audit --no-fund \
            >"${PRIVATE_INSTALL_LOG}" 2>&1; then
            echo "::error::Dependency install failed. Inspect private source run ${ATTESTED_RUN_ID}."
            exit 1
          fi

      - name: Rebuild attested source without public logs
        working-directory: ${{ env.PRIVATE_WEB_DIR }}
        shell: bash
        env:
          NODE_ENV: production
          BLOG_ENV: production
          TEST_EXPORT: "1"
          ATTESTED_RUN_ID: ${{ steps.source_attestation.outputs.run_id }}
          PRIVATE_BUILD_LOG: ${{ runner.temp }}/private-build.log
        run: |
          set -euo pipefail

          if ! npm run build:ci >"${PRIVATE_BUILD_LOG}" 2>&1; then
            echo "::error::Static build failed. Inspect private source run ${ATTESTED_RUN_ID}."
            exit 1
          fi

          if ! npm run verify:export >>"${PRIVATE_BUILD_LOG}" 2>&1; then
            echo "::error::Export verification failed. Inspect private source run ${ATTESTED_RUN_ID}."
            exit 1
          fi

      - name: Prepare public Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          test -d "${PRIVATE_WEB_DIR}/out"

          if find "${PRIVATE_WEB_DIR}/out" \
            \( -name ".git" -o -name ".github" \) -print -quit | grep -q .; then
            echo "::error::Repository metadata was found in the public output."
            exit 1
          fi

          if find "${PRIVATE_WEB_DIR}/out" -type l -print -quit | grep -q .; then
            echo "::error::Symbolic links are forbidden in the Pages artifact."
            exit 1
          fi

          if find "${PRIVATE_WEB_DIR}/out" -type f -links +1 -print -quit |
            grep -q .; then
            echo "::error::Hard links are forbidden in the Pages artifact."
            exit 1
          fi

          mkdir -p "${PAGES_ARTIFACT_DIR}"
          rsync -a --delete \
            "${PRIVATE_WEB_DIR}/out/" \
            "${PAGES_ARTIFACT_DIR}/"

      - name: Remove private source before artifact upload
        shell: bash
        env:
          PRIVATE_INSTALL_LOG: ${{ runner.temp }}/private-install.log
          PRIVATE_BUILD_LOG: ${{ runner.temp }}/private-build.log
          SOURCE_ATTESTATION_FILE: ${{ runner.temp }}/source-run.json
        run: |
          set -euo pipefail

          rm -rf "${PRIVATE_REPO_DIR}"
          rm -f \
            "${PRIVATE_INSTALL_LOG}" \
            "${PRIVATE_BUILD_LOG}" \
            "${SOURCE_ATTESTATION_FILE}" \
            "${RUNNER_TEMP}/source-run-response.json"

          test ! -e "${PRIVATE_REPO_DIR}"
          test -d "${PAGES_ARTIFACT_DIR}"
          test ! -e "${PAGES_ARTIFACT_DIR}/.git"
          test ! -e "${PAGES_ARTIFACT_DIR}/.github"
          test ! -e "${PAGES_ARTIFACT_DIR}/web"

      - name: Upload public Pages artifact only
        # actions/upload-pages-artifact@v5
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./${{ env.PAGES_ARTIFACT_DIR }}
          retention-days: 1

      - name: Record verified deployment identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ATTESTED_RUN_ID: ${{ steps.source_attestation.outputs.run_id }}
          ATTESTED_RUN_ATTEMPT: ${{ steps.source_attestation.outputs.run_attempt }}
        run: |
          {
            echo "## Verified Pages Build"
            echo
            echo "- Source repository: \`buenhyden/blog-data\`"
            echo "- Source ref: \`main\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Source run: \`${ATTESTED_RUN_ID}\`"
            echo "- Source attempt: \`${ATTESTED_RUN_ATTEMPT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Final cleanup
        if: always()
        shell: bash
        env:
          PRIVATE_INSTALL_LOG: ${{ runner.temp }}/private-install.log
          PRIVATE_BUILD_LOG: ${{ runner.temp }}/private-build.log
          SOURCE_ATTESTATION_FILE: ${{ runner.temp }}/source-run.json
        run: |
          rm -rf "${PRIVATE_REPO_DIR}" "${PAGES_ARTIFACT_DIR}"
          rm -f \
            "${PRIVATE_INSTALL_LOG}" \
            "${PRIVATE_BUILD_LOG}" \
            "${SOURCE_ATTESTATION_FILE}" \
            "${RUNNER_TEMP}/source-run-response.json"

  deploy:
    name: Deploy verified Pages artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        # actions/deploy-pages@v5
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  smoke_post_deploy:
    name: Verify deployed public routes
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify core endpoints availability
        shell: bash
        run: |
          set -euo pipefail

          ROUTES=(
            "/"
            "/about/"
            "/about/projects/"
            "/about/experiences/"
            "/about/skills/"
            "/blog/"
            "/series/"
            "/posts/"
            "/til/"
            "/tags/"
            "/categories/"
          )

          for route in "${ROUTES[@]}"; do
            url="https://buenhyden.github.io${route}"
            echo "Checking ${url}"
            success=0
            for _attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location \
                "${url}" > /dev/null; then
                success=1
                break
              fi
              sleep 10
            done

            if [[ "${success}" -ne 1 ]]; then
              echo "::error::Smoke check failed for ${url}"
              exit 1
            fi
          done

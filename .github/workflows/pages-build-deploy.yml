---
name: Pages CI Build and Deploy

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Private source repository"
        required: true
        type: string
      source_ref_name:
        description: "Source branch name"
        required: true
        type: string
      source_web_dir:
        description: "Source web directory"
        required: false
        default: "web"
        type: string
      source_sha:
        description: "Immutable source commit SHA"
        required: true
        type: string
      source_event:
        description: "Original source event"
        required: true
        type: string
      source_run_id:
        description: "Exact source workflow run ID"
        required: true
        type: string
      source_run_attempt:
        description: "Exact source workflow run attempt"
        required: true
        type: string
      html_signature:
        description: "Required HTML identity marker"
        required: true
        type: string

# Deny GitHub's token all capabilities by default. Each job receives only the
# permissions it needs; cross-repository reads use the scoped repository secret.
permissions: {}

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Verify source and package Pages output
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PRIVATE_REPO_DIR: __private_blog_data
      PAGES_ARTIFACT_DIR: __pages_artifact

    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF_NAME: ${{ inputs.source_ref_name }}
          SOURCE_WEB_DIR: ${{ inputs.source_web_dir }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_EVENT: ${{ inputs.source_event }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          HTML_SIGNATURE: ${{ inputs.html_signature }}
        run: |
          set -euo pipefail

          [[ "${SOURCE_REPO}" == "buenhyden/blog-data" ]]
          [[ "${SOURCE_REF_NAME}" == "main" ]]
          [[ "${SOURCE_EVENT}" == "push" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SOURCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${HTML_SIGNATURE}" == "quiet-editorial-notebook:v1" ]]
          SOURCE_WEB_DIR="${SOURCE_WEB_DIR:-web}"
          [[ "${SOURCE_WEB_DIR}" == "web" || "${SOURCE_WEB_DIR}" == "site/web" ]]
          echo "PRIVATE_WEB_DIR=${PRIVATE_REPO_DIR}/${SOURCE_WEB_DIR}" >> "${GITHUB_ENV}"

      - name: Verify successful private source CI run
        id: source_attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BLOG_DEPLOY_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_ATTESTATION_FILE: ${{ runner.temp }}/source-run.json
        run: |
          set -euo pipefail

          API_ROOT="https://api.github.com/repos/buenhyden/blog-data"
          ATTESTED=false

          for attestation_attempt in {1..24}; do
            RUN_URL="${API_ROOT}/actions/runs/${SOURCE_RUN_ID}"
            curl --fail-with-body --retry 3 --retry-delay 3 \
              --retry-connrefused --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${RUN_URL}" \
              --output "${SOURCE_ATTESTATION_FILE}"

            if jq --exit-status \
              --arg source_sha "${SOURCE_SHA}" \
              --arg source_run_id "${SOURCE_RUN_ID}" \
              --arg source_run_attempt "${SOURCE_RUN_ATTEMPT}" \
              '
                .repository.full_name == "buenhyden/blog-data" and
                .head_repository.full_name == "buenhyden/blog-data" and
                .status == "completed" and
                .conclusion == "success" and
                .event == "push" and
                .head_branch == "main" and
                .path == ".github/workflows/trigger-pages-build.yml" and
                .head_sha == $source_sha and
                (.id | tostring) == $source_run_id and
                (.run_attempt | tostring) == $source_run_attempt
              ' "${SOURCE_ATTESTATION_FILE}" > /dev/null; then
              ATTESTED=true
              break
            fi

            echo "Waiting for private source run attestation (${attestation_attempt}/24)."
            sleep 5
          done

          if [[ "${ATTESTED}" != "true" ]]; then
            echo "::error::Private source CI run did not reach a verified success state."
            exit 1
          fi

          ATTESTED_RUN_ID="$(jq --raw-output '.id' "${SOURCE_ATTESTATION_FILE}")"
          ATTESTED_RUN_ATTEMPT="$(
            jq --raw-output '.run_attempt' "${SOURCE_ATTESTATION_FILE}"
          )"
          echo "run_id=${ATTESTED_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "run_attempt=${ATTESTED_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "Verified private source CI run ${ATTESTED_RUN_ID}."

      - name: Retrieve exact private source context
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BLOG_DEPLOY_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ steps.source_attestation.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source_attestation.outputs.run_attempt }}
          SOURCE_CONTEXT_LIST: ${{ runner.temp }}/source-context-list.json
          SOURCE_CONTEXT_ZIP: ${{ runner.temp }}/source-context.zip
          SOURCE_CONTEXT_FILE: ${{ runner.temp }}/source-context.json
        run: |
          set -euo pipefail
          API_ROOT="https://api.github.com/repos/buenhyden/blog-data"
          ARTIFACT_NAME="source-context-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          curl --fail --silent --show-error --location --max-filesize 65536 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_ROOT}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --output "${SOURCE_CONTEXT_LIST}"
          ARTIFACT_ID="$(jq --exit-status --raw-output --arg name "${ARTIFACT_NAME}" '
            (.artifacts | map(select(.name == $name))) as $matches |
            select(.total_count <= 100 and ($matches | length) == 1) |
            $matches[0] |
            select(.expired == false and .size_in_bytes <= 16384 and
              (.id | type) == "number" and .id > 0 and
              (.workflow_run.id | tostring) == env.SOURCE_RUN_ID and
              .workflow_run.head_sha == env.SOURCE_SHA) | .id
          ' "${SOURCE_CONTEXT_LIST}")"
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          curl --fail --silent --show-error --location --max-filesize 16384 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_ROOT}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "${SOURCE_CONTEXT_ZIP}"
          python3 - <<'PY'
          import json
          import os
          import re
          import stat
          import zipfile

          expected = {
              "schema_version": 1,
              "source_repository": "buenhyden/blog-data",
              "event": "push",
              "ref": "refs/heads/main",
              "source_sha": os.environ["SOURCE_SHA"],
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "source_run_attempt": os.environ["SOURCE_RUN_ATTEMPT"],
          }
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate source context key")
                  result[key] = value
              return result

          with zipfile.ZipFile(os.environ["SOURCE_CONTEXT_ZIP"]) as archive:
              entries = archive.infolist()
              if len(entries) != 1 or entries[0].filename != "source-context.json":
                  raise ValueError("source context archive shape")
              entry = entries[0]
              if entry.file_size > 2048 or stat.S_ISLNK(entry.external_attr >> 16) or stat.S_ISDIR(entry.external_attr >> 16):
                  raise ValueError("source context entry type or size")
              with archive.open(entry) as stream:
                  raw = stream.read(2049)
              if len(raw) > 2048:
                  raise ValueError("source context exceeds limit")
          data = json.loads(raw.decode("utf-8"), object_pairs_hook=unique)
          if not isinstance(data, dict) or type(data.get("schema_version")) is not int:
              raise ValueError("source context schema type")
          if set(data) != set(expected) | {"source_before"}:
              raise ValueError("source context schema")
          if any(data[key] != value for key, value in expected.items()):
              raise ValueError("source context tuple")
          before = data["source_before"]
          if not isinstance(before, str) or not re.fullmatch(r"[0-9a-f]{40}", before):
              raise ValueError("source context previous revision")
          if before == "0" * 40 or before == data["source_sha"]:
              raise ValueError("source context previous revision")
          with open(os.environ["SOURCE_CONTEXT_FILE"], "xb") as output:
              output.write(raw)
          PY

      - name: Checkout exact private source commit
        # actions/checkout@v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: buenhyden/blog-data
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.BLOG_DEPLOY_TOKEN }}
          path: ${{ env.PRIVATE_REPO_DIR }}
          persist-credentials: false
          fetch-depth: 0
          show-progress: false

      - name: Verify exact private source checkout
        working-directory: ${{ env.PRIVATE_REPO_DIR }}
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Setup Node
        # actions/setup-node@v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install private source dependencies quietly
        working-directory: ${{ env.PRIVATE_WEB_DIR }}
        shell: bash
        env:
          HUSKY: "0"
          ATTESTED_RUN_ID: ${{ steps.source_attestation.outputs.run_id }}
          PRIVATE_INSTALL_LOG: ${{ runner.temp }}/private-install.log
        run: |
          set -euo pipefail

          if ! npm ci --no-audit --no-fund \
            >"${PRIVATE_INSTALL_LOG}" 2>&1; then
            echo "::error::Dependency install failed. Inspect private source run ${ATTESTED_RUN_ID}."
            exit 1
          fi

      - name: Install export verification browser quietly
        working-directory: ${{ env.PRIVATE_WEB_DIR }}
        shell: bash
        env:
          ATTESTED_RUN_ID: ${{ steps.source_attestation.outputs.run_id }}
          PRIVATE_BROWSER_LOG: ${{ runner.temp }}/private-browser-install.log
        run: |
          set -euo pipefail

          if ! npx playwright install --with-deps chromium \
            >"${PRIVATE_BROWSER_LOG}" 2>&1; then
            echo "::error::Export verification browser install failed. Inspect private source run ${ATTESTED_RUN_ID}."
            exit 1
          fi

      - name: Rebuild attested source without public logs
        working-directory: ${{ env.PRIVATE_WEB_DIR }}
        shell: bash
        env:
          NODE_ENV: production
          BLOG_ENV: production
          TEST_EXPORT: "1"
          ATTESTED_RUN_ID: ${{ steps.source_attestation.outputs.run_id }}
          PRIVATE_BUILD_LOG: ${{ runner.temp }}/private-build.log
          SOURCE_CONTEXT_FILE: ${{ runner.temp }}/source-context.json
          BLOG_SOURCE_REPOSITORY: ${{ inputs.source_repo }}
          BLOG_SOURCE_REF_NAME: ${{ inputs.source_ref_name }}
          BLOG_SOURCE_SHA: ${{ inputs.source_sha }}
          BLOG_SOURCE_EVENT: ${{ inputs.source_event }}
          BLOG_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          BLOG_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          BLOG_BUILDER_REPOSITORY: ${{ github.repository }}
          BLOG_BUILDER_RUN_ID: ${{ github.run_id }}
          BLOG_BUILDER_RUN_ATTEMPT: ${{ github.run_attempt }}
          BLOG_HTML_SIGNATURE: ${{ inputs.html_signature }}
        run: |
          set -euo pipefail

          if ! bash -euo pipefail >"${PRIVATE_BUILD_LOG}" 2>&1 <<'BUILD'; then
            set +x
            private_root="${GITHUB_WORKSPACE}/${PRIVATE_REPO_DIR}"
            dictionary_rel="00_System/Templates/Content/_system/content-classification-dictionary.json"
            previous_revision="$(jq --exit-status --raw-output \
              --arg repository "${BLOG_SOURCE_REPOSITORY}" \
              --arg event "${BLOG_SOURCE_EVENT}" \
              --arg ref "refs/heads/${BLOG_SOURCE_REF_NAME}" \
              --arg sha "${BLOG_SOURCE_SHA}" \
              --arg run_id "${BLOG_SOURCE_RUN_ID}" \
              --arg attempt "${BLOG_SOURCE_RUN_ATTEMPT}" \
              'select((keys | sort) == (["schema_version", "source_repository", "event", "ref", "source_sha", "source_before", "source_run_id", "source_run_attempt"] | sort) and
                .schema_version == 1 and .source_repository == $repository and
                .event == $event and .ref == $ref and .source_sha == $sha and
                .source_run_id == $run_id and .source_run_attempt == $attempt and
                (.source_before | type) == "string") | .source_before' \
              "${SOURCE_CONTEXT_FILE}")"
            [[ "${previous_revision}" != "0000000000000000000000000000000000000000" ]]
            [[ "${previous_revision}" != "${BLOG_SOURCE_SHA}" ]]
            [[ "${previous_revision}" =~ ^[0-9a-f]{40}$ ]]
            test "$(git -C "${private_root}" rev-parse HEAD)" = "${BLOG_SOURCE_SHA}"
            test "$(git -C "${private_root}" cat-file -t "${previous_revision}")" = commit
            git -C "${private_root}" merge-base --is-ancestor "${previous_revision}" HEAD
            previous_mode="$(git -C "${private_root}" ls-tree "${previous_revision}" -- "${dictionary_rel}" | awk '{print $1}')"
            [[ "${previous_mode}" == 100644 || "${previous_mode}" == 100755 ]]
            dictionary_entry="$(git -C "${private_root}" ls-tree HEAD -- "${dictionary_rel}")"
            dictionary_mode="$(printf '%s\n' "${dictionary_entry}" | awk '{print $1}')"
            dictionary_oid="$(printf '%s\n' "${dictionary_entry}" | awk '{print $3}')"
            [[ "${dictionary_mode}" == 100644 || "${dictionary_mode}" == 100755 ]]
            [[ "${dictionary_oid}" =~ ^[0-9a-f]{40}$ ]]
            test "$(git -C "${private_root}" cat-file -t "${dictionary_oid}")" = blob
            CONTENT_EXPECTED_CLASSIFICATION_SHA256="$(git -C "${private_root}" cat-file blob "${dictionary_oid}" | sha256sum | cut -d' ' -f1)"
            test "$(sha256sum "${private_root}/${dictionary_rel}" | cut -d' ' -f1)" = "${CONTENT_EXPECTED_CLASSIFICATION_SHA256}"
            CONTENT_PREVIOUS_DICTIONARY_REVISION="${previous_revision}"
            export CONTENT_PREVIOUS_DICTIONARY_REVISION CONTENT_EXPECTED_CLASSIFICATION_SHA256
            npm run build:ci
            npm run build:manifest
            npm run verify:provenance
            npm run verify:html-signature
            npm run verify:export
          BUILD
            echo "::error::Private rebuild or historical input verification failed. Inspect private source run ${ATTESTED_RUN_ID}."
            exit 1
          fi

      - name: Prepare public Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          test -d "${PRIVATE_WEB_DIR}/out"
          test -f "${PRIVATE_WEB_DIR}/out/build-manifest.json"

          if find "${PRIVATE_WEB_DIR}/out" \
            \( -name ".git" -o -name ".github" -o -name "*.pem" -o -name "*.key" \) \
            -print -quit | grep -q .; then
            echo "::error::Repository metadata or key material was found in the public output."
            exit 1
          fi

          if find "${PRIVATE_WEB_DIR}/out" -type f -path "*/content/*" \
            -print -quit | grep -q .; then
            echo "::error::Private source content was found in the public output."
            exit 1
          fi

          if find "${PRIVATE_WEB_DIR}/out" -type l -print -quit | grep -q .; then
            echo "::error::Symbolic links are forbidden in the Pages artifact."
            exit 1
          fi

          if find "${PRIVATE_WEB_DIR}/out" -type f -links +1 -print -quit |
            grep -q .; then
            echo "::error::Hard links are forbidden in the Pages artifact."
            exit 1
          fi

          mkdir -p "${PAGES_ARTIFACT_DIR}"
          rsync -a --delete \
            "${PRIVATE_WEB_DIR}/out/" \
            "${PAGES_ARTIFACT_DIR}/"

      - name: Record verified deployment identity
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF_NAME: ${{ inputs.source_ref_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ steps.source_attestation.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source_attestation.outputs.run_attempt }}
          BUILDER_REPOSITORY: ${{ github.repository }}
          BUILDER_RUN_ID: ${{ github.run_id }}
          BUILDER_RUN_ATTEMPT: ${{ github.run_attempt }}
          HTML_SIGNATURE: ${{ inputs.html_signature }}
        run: |
          set -euo pipefail

          MANIFEST="${PRIVATE_WEB_DIR}/out/build-manifest.json"
          ARTIFACT_NAME="$(jq --raw-output '.artifact.name' "${MANIFEST}")"

          {
            echo "## Verified Pages Build"
            echo
            echo "- Source repository: \`${SOURCE_REPO}\`"
            echo "- Source ref: \`${SOURCE_REF_NAME}\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Source run: \`${SOURCE_RUN_ID}\`"
            echo "- Source attempt: \`${SOURCE_RUN_ATTEMPT}\`"
            echo "- Builder repository: \`${BUILDER_REPOSITORY}\`"
            echo "- Builder run: \`${BUILDER_RUN_ID}\`"
            echo "- Builder attempt: \`${BUILDER_RUN_ATTEMPT}\`"
            echo "- Artifact: \`${ARTIFACT_NAME}\`"
            echo "- HTML signature: \`${HTML_SIGNATURE}\`"
            echo "- Provenance validator: \`PASS\`"
            echo "- HTML validator: \`PASS\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove private source before artifact upload
        shell: bash
        env:
          PRIVATE_INSTALL_LOG: ${{ runner.temp }}/private-install.log
          PRIVATE_BROWSER_LOG: ${{ runner.temp }}/private-browser-install.log
          PRIVATE_BUILD_LOG: ${{ runner.temp }}/private-build.log
          SOURCE_ATTESTATION_FILE: ${{ runner.temp }}/source-run.json
          SOURCE_CONTEXT_LIST: ${{ runner.temp }}/source-context-list.json
          SOURCE_CONTEXT_ZIP: ${{ runner.temp }}/source-context.zip
          SOURCE_CONTEXT_FILE: ${{ runner.temp }}/source-context.json
        run: |
          set -euo pipefail

          rm -rf "${PRIVATE_REPO_DIR}"
          rm -f \
            "${PRIVATE_INSTALL_LOG}" \
            "${PRIVATE_BROWSER_LOG}" \
            "${PRIVATE_BUILD_LOG}" \
            "${SOURCE_ATTESTATION_FILE}" \
            "${SOURCE_CONTEXT_LIST}" \
            "${SOURCE_CONTEXT_ZIP}" \
            "${SOURCE_CONTEXT_FILE}"

          test ! -e "${PRIVATE_REPO_DIR}"
          test -d "${PAGES_ARTIFACT_DIR}"
          test ! -e "${PAGES_ARTIFACT_DIR}/.git"
          test ! -e "${PAGES_ARTIFACT_DIR}/.github"
          test ! -e "${PAGES_ARTIFACT_DIR}/web"
          test ! -e "${PAGES_ARTIFACT_DIR}/site/web"

      - name: Upload public Pages artifact only
        # actions/upload-pages-artifact@v5
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./${{ env.PAGES_ARTIFACT_DIR }}
          retention-days: 1

      - name: Final cleanup
        if: always()
        shell: bash
        env:
          PRIVATE_INSTALL_LOG: ${{ runner.temp }}/private-install.log
          PRIVATE_BROWSER_LOG: ${{ runner.temp }}/private-browser-install.log
          PRIVATE_BUILD_LOG: ${{ runner.temp }}/private-build.log
          SOURCE_ATTESTATION_FILE: ${{ runner.temp }}/source-run.json
          SOURCE_CONTEXT_LIST: ${{ runner.temp }}/source-context-list.json
          SOURCE_CONTEXT_ZIP: ${{ runner.temp }}/source-context.zip
          SOURCE_CONTEXT_FILE: ${{ runner.temp }}/source-context.json
        run: |
          rm -rf "${PRIVATE_REPO_DIR}" "${PAGES_ARTIFACT_DIR}"
          rm -f \
            "${PRIVATE_INSTALL_LOG}" \
            "${PRIVATE_BROWSER_LOG}" \
            "${PRIVATE_BUILD_LOG}" \
            "${SOURCE_ATTESTATION_FILE}" \
            "${SOURCE_CONTEXT_LIST}" \
            "${SOURCE_CONTEXT_ZIP}" \
            "${SOURCE_CONTEXT_FILE}"

  deploy:
    name: Deploy verified Pages artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        # actions/deploy-pages@v5
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  smoke_post_deploy:
    name: Verify deployed provenance and public routes
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify live manifest and HTML identity
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repo }}
          SOURCE_REF_NAME: ${{ inputs.source_ref_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          BUILDER_REPOSITORY: ${{ github.repository }}
          BUILDER_RUN_ID: ${{ github.run_id }}
          HTML_SIGNATURE: ${{ inputs.html_signature }}
        run: |
          set -euo pipefail

          SITE_URL="https://buenhyden.github.io"
          LIVE_MANIFEST="${RUNNER_TEMP}/live-build-manifest.json"
          MANIFEST_VERIFIED=false

          for manifest_attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
              "${SITE_URL}/build-manifest.json" \
              --output "${LIVE_MANIFEST}" &&
              jq --exit-status \
                --arg source_repository "${SOURCE_REPOSITORY}" \
                --arg source_ref_name "${SOURCE_REF_NAME}" \
                --arg source_sha "${SOURCE_SHA}" \
                --arg source_run_id "${SOURCE_RUN_ID}" \
                --arg builder_repository "${BUILDER_REPOSITORY}" \
                --arg builder_run_id "${BUILDER_RUN_ID}" \
                --arg html_signature "${HTML_SIGNATURE}" \
                '
                  .schemaVersion == 1 and
                  .source.repository == $source_repository and
                  .source.refName == $source_ref_name and
                  .source.sha == $source_sha and
                  .source.runId == $source_run_id and
                  .builder.repository == $builder_repository and
                  .builder.runId == $builder_run_id and
                  .artifact.htmlSignature == $html_signature
                ' "${LIVE_MANIFEST}" > /dev/null; then
              MANIFEST_VERIFIED=true
              break
            fi
            echo "Waiting for live manifest identity (${manifest_attempt}/12)."
            sleep 10
          done

          if [[ "${MANIFEST_VERIFIED}" != "true" ]]; then
            echo "::error::Live build manifest does not match the deployed source and builder identity."
            exit 1
          fi

          ROUTES=(
            "/|ko"
            "/posts/|ko"
            "/blog/|ko"
            "/til/|ko"
            "/search/|ko"
            "/about/|ko"
            "/categories/|ko"
            "/tags/|ko"
            "/series/|ko"
            "/en/search/|en"
          )

          for route_record in "${ROUTES[@]}"; do
            route="${route_record%%|*}"
            language="${route_record##*|}"
            url="${SITE_URL}${route}"
            body_file="${RUNNER_TEMP}/live-route.html"
            echo "Checking ${url}"
            success=0
            for _ in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location \
                --output "${body_file}" \
                "${url}" &&
                grep --fixed-strings --quiet \
                  "data-site-signature=\"${HTML_SIGNATURE}\"" "${body_file}" &&
                grep --fixed-strings --quiet \
                  "data-source-sha=\"${SOURCE_SHA}\"" "${body_file}" &&
                grep --fixed-strings --quiet \
                  "name=\"blog-source-sha\" content=\"${SOURCE_SHA}\"" "${body_file}" &&
                grep --extended-regexp --quiet \
                  "<html[^>]*lang=\"${language}\"" "${body_file}"; then
                success=1
                break
              fi
              sleep 10
            done

            if [[ "${success}" -ne 1 ]]; then
              echo "::error::Live HTML identity check failed for ${url}"
              exit 1
            fi
          done

          NOT_FOUND_BODY="${RUNNER_TEMP}/live-404.html"
          NOT_FOUND_STATUS="$(
            curl --silent --show-error --location \
              --output "${NOT_FOUND_BODY}" \
              --write-out "%{http_code}" \
              "${SITE_URL}/definitely-missing-redesign-route/"
          )"
          [[ "${NOT_FOUND_STATUS}" == "404" ]]
          grep --fixed-strings --quiet \
            "data-site-signature=\"${HTML_SIGNATURE}\"" "${NOT_FOUND_BODY}"
          grep --fixed-strings --quiet \
            "data-source-sha=\"${SOURCE_SHA}\"" "${NOT_FOUND_BODY}"

          {
            echo "## Live Pages Verification"
            echo
            echo "- Deployment URL: \`${SITE_URL}/\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Source run: \`${SOURCE_RUN_ID}\`"
            echo "- Builder run: \`${BUILDER_RUN_ID}\`"
            echo "- HTML signature: \`${HTML_SIGNATURE}\`"
            echo "- Live manifest: \`PASS\`"
            echo "- Representative HTML: \`PASS\`"
            echo "- 404 behavior: \`PASS\`"
          } >> "${GITHUB_STEP_SUMMARY}"

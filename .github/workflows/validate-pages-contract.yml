---
name: Validate Pages Workflow Contract

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pages-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public deployment repository
        # actions/checkout@v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Setup Node
        # actions/setup-node@v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run workflow policy regression tests
        run: node --test .github/scripts/validate-pages-workflow.test.mjs

      - name: Validate canonical deploy workflow
        run: node .github/scripts/validate-pages-workflow.mjs
